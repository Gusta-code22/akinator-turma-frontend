<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akinator da Turma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <button id="btn-tema" class="botao-tema" aria-label="Alternar tema">🌙</button>

        <!-- Tela inicial -->
        <section id="tela-inicial" class="tela">
            <h1>🔮 Akinator da Turma</h1>
            <p>Pense em alguém da turma. Eu vou tentar descobrir quem é!</p>
            <button id="btn-iniciar">Começar</button>
        </section>

        <!-- Tela do jogo (pergunta) -->
        <section id="tela-jogo" class="tela escondida">
            <p id="contador-candidatos" class="texto-secundario"></p>
            <h2 id="texto-pergunta"></h2>
            <div class="botoes-resposta">
                <button id="btn-sim">Sim</button>
                <button id="btn-nao">Não</button>
            </div>
        </section>

        <!-- Tela de resultado (descobriu) -->
        <section id="tela-resultado" class="tela escondida">
            <p class="texto-secundario">Eu acho que é...</p>
            <img id="foto-pessoa" src="" alt="">
            <h2 id="nome-pessoa"></h2>
            <button id="btn-jogar-novamente">Jogar novamente</button>
        </section>

        <!-- Tela de "não descobri" -->
        <section id="tela-nao-descobriu" class="tela escondida">
            <h2>🤔 Você venceu!</h2>
            <p>Não consegui descobrir quem é dessa vez.</p>
            <button id="btn-jogar-novamente-2">Jogar novamente</button>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
